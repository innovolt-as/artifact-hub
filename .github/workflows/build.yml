# Optional: build + push to ghcr.io on every push to main (you can keep building locally instead).
name: build
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ghcr requires lowercase image names (repository_owner may be e.g. "MartinTonne")
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/artifact-hub" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
