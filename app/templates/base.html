<!doctype html>
{% set th = theme() %}
<html lang="{{ lang() }}"{% if th != 'auto' %} data-theme="{{ th }}"{% endif %}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site }}{% endblock %}</title>
<link rel="stylesheet" href="/static/hub.css">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b1a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{ site }}">
<script src="/static/pull.js" defer></script>
</head>
<body>
{% block topbar %}{% endblock %}
<div data-pull-content>
{% block header %}
<header class="top">
  <a class="brand" href="/"><img src="/static/logo.svg" alt="" width="26" height="26">{{ site }}</a>
  {% if user %}
  <nav>
    {% if admin %}<a href="/admin" class="{% if request.url.path == '/admin' %}active{% endif %}">{{ t("nav.admin") }}</a>{% endif %}
    <a class="who" href="/settings">{{ user }}</a>
    <a class="who-icon" href="/settings" aria-label="{{ t('settings.title') }}"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></a>
    <form method="post" action="/logout"><button class="link">{{ t("nav.logout") }}</button></form>
  </nav>
  {% endif %}
</header>
{% endblock %}
<main>
{% block body %}{% endblock %}
</main>
</div>
</body>
</html>
