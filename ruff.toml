target-version = "py312"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[lint.flake8-bugbear]
# FastAPI declares request parameters with calls as defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]

[lint.per-file-ignores]
# fixtures imported from another test module come back as test arguments
"tests/*" = ["F811"]
